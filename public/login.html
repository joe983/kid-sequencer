<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>window.location.replace("./index.html");</script>
  <title>Login</title>
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f6fbff;
      font-family: Arial, sans-serif;
    }
    .card{
      width:320px;
      background:#fff;
      border:4px solid #1d1d1d;
      border-radius:18px;
      box-shadow:0 8px 0 rgba(0,0,0,0.07);
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    h2{ margin:0; text-align:center; font-weight:900; }
    .hint{
      margin:0;
      font-size:12px;
      color:#333;
      text-align:center;
      opacity:0.8;
    }
    input, button{
      height:44px;
      border-radius:12px;
      border:3px solid #1d1d1d;
      padding:0 10px;
      font-size:16px;
      box-sizing:border-box;
    }
    button{
      height:52px;
      font-weight:900;
      cursor:pointer;
      background:#fff;
    }
    button:disabled{
      opacity:0.5;
      cursor:not-allowed;
    }
    .primary{
      background:#ffe45c;
    }
    .row{
      display:flex;
      gap:10px;
    }
    .row button{
      flex:1;
      height:46px;
      font-size:14px;
    }
    .status{
      min-height:18px;
      font-size:13px;
      text-align:center;
      font-weight:700;
      color:#b10000;
    }
    .mode{
      font-size:12px;
      text-align:center;
      font-weight:800;
      letter-spacing:0.2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="title">Login</h2>
    <p class="hint">Your details may auto-fill, but you must click the button to sign in.</p>

    <input id="email" placeholder="Email" autocomplete="email" inputmode="email">
    <input id="password" placeholder="Password" type="password" autocomplete="current-password">

    <div class="status" id="status"></div>

    <button class="primary" id="loginBtn">Login</button>

    <div class="row">
      <button id="toggleBtn">Create Account</button>
      <button id="guestBtn">Continue as Guest</button>
    </div>

    <div class="mode" id="modeLabel">Mode: Login</div>
  </div>

  <script type="module">
    // Firebase Auth (modular v10) — matches your index.html pattern using ./js/firebase-init.js
    import { auth } from "./js/firebase-init.js";
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const $ = (id) => document.getElementById(id);
    const emailEl = $("email");
    const passEl  = $("password");
    const statusEl = $("status");
    const titleEl = $("title");
    const modeLabelEl = $("modeLabel");

    const loginBtn = $("loginBtn");
    const toggleBtn = $("toggleBtn");
    const guestBtn = $("guestBtn");

    let mode = "login"; // "login" | "create"

    function setStatus(msg, isError=true){
      statusEl.style.color = isError ? "#b10000" : "#0a7a2f";
      statusEl.textContent = msg || "";
    }

    function setMode(next){
      mode = next;
      if(mode === "create"){
        titleEl.textContent = "Create Account";
        loginBtn.textContent = "Create Account";
        toggleBtn.textContent = "Back to Login";
        modeLabelEl.textContent = "Mode: Create Account";
      }else{
        titleEl.textContent = "Login";
        loginBtn.textContent = "Login";
        toggleBtn.textContent = "Create Account";
        modeLabelEl.textContent = "Mode: Login";
      }
      setStatus("");
    }

    function setBusy(b){
      loginBtn.disabled = b;
      toggleBtn.disabled = b;
      guestBtn.disabled = b;
      emailEl.disabled = b;
      passEl.disabled = b;
    }

    // IMPORTANT: stop the "already logged in" experience:
    // If this page opens and a user is still authenticated, immediately sign them out.
    // This prevents any auto-redirect / auto-logged-in flow.
    try{
      await signOut(auth);
    }catch(e){
      // ignore
    }

    toggleBtn.addEventListener("click", () => {
      setMode(mode === "login" ? "create" : "login");
    });

    guestBtn.addEventListener("click", () => {
      // Ensure any old "logged in" flag is cleared for the current tab
      try{ sessionStorage.removeItem("kidseq_logged_in"); }catch(e){}
      window.location.href = "./index.html";
    });

    function validate(){
      const email = (emailEl.value || "").trim();
      const pass  = (passEl.value || "");
      if(!email || !pass){
        setStatus("Enter email + password.");
        return null;
      }
      return { email, pass };
    }

    async function doLogin(){
      const v = validate();
      if(!v) return;

      setBusy(true);
      setStatus("Working...", false);

      try{
        if(mode === "create"){
          await createUserWithEmailAndPassword(auth, v.email, v.pass);
        }else{
          await signInWithEmailAndPassword(auth, v.email, v.pass);
        }

        // Keep compatibility with your current index.html gating (sessionStorage).
        // This is *tab-scoped*, so it won't survive a full browser close.
        try{ sessionStorage.setItem("kidseq_logged_in", "1"); }catch(e){}

        setStatus("Success! Loading…", false);
        window.location.href = "./index.html";
      }catch(err){
        console.error(err);
        setStatus("Login failed. Check console for details.");
      }finally{
        setBusy(false);
      }
    }

    loginBtn.addEventListener("click", doLogin);

    // Press Enter to submit
    passEl.addEventListener("keydown", (e) => {
      if(e.key === "Enter") doLogin();
    });

    // Default mode
    setMode("login");
  </script>
</body>
</html>
