<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoom Debug Log Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: monospace; background: #1a1a2e; color: #0f0; padding: 10px; }
  h1 { color: #fff; font-size: 18px; margin-bottom: 10px; }
  .controls { margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .controls button {
    padding: 6px 14px; border: 1px solid #444; background: #2a2a4a;
    color: #fff; cursor: pointer; border-radius: 4px; font-size: 13px;
  }
  .controls button:hover { background: #3a3a6a; }
  .controls button.danger { border-color: #a33; }
  .controls button.danger:hover { background: #a33; }
  .controls select, .controls input {
    padding: 5px 8px; border: 1px solid #444; background: #2a2a4a;
    color: #fff; border-radius: 4px; font-size: 13px;
  }
  .session-list { margin-bottom: 15px; }
  .session-item {
    padding: 8px 12px; margin: 4px 0; background: #2a2a4a; border: 1px solid #444;
    border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between;
  }
  .session-item:hover { background: #3a3a6a; }
  .session-item.active { border-color: #0f0; background: #1a3a1a; }
  .session-info { color: #aaa; font-size: 12px; }
  .log-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .log-table th { 
    background: #2a2a4a; color: #fff; padding: 4px 6px; text-align: left;
    position: sticky; top: 0; border-bottom: 2px solid #0f0;
  }
  .log-table td { padding: 3px 6px; border-bottom: 1px solid #333; white-space: nowrap; }
  .log-table tr:hover { background: #2a2a4a; }
  .log-table tr.event-grace td { color: #ff0; }
  .log-table tr.event-grace-end td { color: #fa0; font-weight: bold; }
  .log-table tr.event-scroll-room-on td { color: #8f8; }
  .log-table tr.event-pinch td { color: #0ff; }
  .log-table tr.event-reset td { color: #f80; }
  .log-table tr.event-ts-land td { color: #f0f; }
  .log-table tr.event-idle td { color: #555; }
  .log-table tr.event-resize td { color: #88f; }
  .log-table tr.event-orient td { color: #88f; }
  .log-table tr.event-PAGE-LOAD td { color: #f00; font-weight: bold; }
  .log-table tr.event-LOGGER-READY td { color: #0f0; font-weight: bold; }
  .log-table tr.event-scroll-guard td { color: #f44; }
  #status { color: #888; margin: 10px 0; font-size: 12px; }
  .log-container { max-height: 80vh; overflow: auto; }
  .filter-label { color: #aaa; font-size: 12px; }
</style>
</head>
<body>
<h1>Zoom Debug Log Viewer</h1>
<div id="status">Connecting to Firestore...</div>

<div class="controls">
  <button id="refreshBtn">🔄 Refresh</button>
  <button id="autoBtn">▶ Auto-refresh</button>
  <button id="exportBtn">💾 Export .txt</button>
  <label class="filter-label">Filter: 
    <select id="filterEvt">
      <option value="">All events</option>
      <option value="pinch">pinch</option>
      <option value="grace">grace</option>
      <option value="grace-end">grace-end</option>
      <option value="ts-land">touchstart-land</option>
      <option value="reset">reset</option>
      <option value="ended-zoom">ended-zoom</option>
      <option value="scroll-guard">scroll-guard</option>
      <option value="scroll-room-on">scroll-room-on</option>
      <option value="resize">resize</option>
      <option value="orient">orient</option>
      <option value="idle">idle</option>
      <option value="PAGE-LOAD">PAGE-LOAD</option>
    </select>
  </label>
  <label class="filter-label">Hide idle: <input type="checkbox" id="hideIdle" checked></label>
  <button id="clearBtn" class="danger">🗑 Clear All Logs</button>
</div>

<div id="sessions" class="session-list">Loading sessions...</div>
<div class="log-container">
  <table class="log-table" id="logTable">
    <thead>
      <tr>
        <th>#</th><th>Time</th><th>Event</th><th>Scale</th><th>oX</th><th>oY</th>
        <th>sY</th><th>sRoom</th><th>iW</th><th>iH</th><th>vvH</th><th>dSH</th><th>oH</th><th>sH</th><th>Extra</th>
      </tr>
    </thead>
    <tbody id="logBody"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, query, orderBy, getDocs, deleteDoc, doc, limit } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBokU1u4hJIxZ0Y4U9BxQreI3hnxEJzuwc",
  authDomain: "kid-sequencer.firebaseapp.com",
  projectId: "kid-sequencer",
  storageBucket: "kid-sequencer.firebasestorage.app",
  messagingSenderId: "715996068165",
  appId: "1:715996068165:web:84e127454cb9bb0c35a62c"
});
const db = getFirestore(app);

const statusEl = document.getElementById('status');
const sessionsEl = document.getElementById('sessions');
const logBody = document.getElementById('logBody');
const filterEvt = document.getElementById('filterEvt');
const hideIdle = document.getElementById('hideIdle');
let allDocs = [];
let selectedSession = null;
let autoInterval = null;

async function loadSessions() {
  statusEl.textContent = 'Loading...';
  try {
    const q = query(collection(db, 'zoomDebug'), orderBy('ts', 'desc'), limit(100));
    const snap = await getDocs(q);
    allDocs = [];
    snap.forEach(d => allDocs.push({ id: d.id, ...d.data() }));
    
    // Group by session
    const sessions = {};
    allDocs.forEach(d => {
      if (!sessions[d.sessionId]) sessions[d.sessionId] = { docs: [], firstTs: d.ts, lastTs: d.ts, count: 0 };
      sessions[d.sessionId].docs.push(d);
      sessions[d.sessionId].count += (d.entries || []).length;
      if (d.ts < sessions[d.sessionId].firstTs) sessions[d.sessionId].firstTs = d.ts;
      if (d.ts > sessions[d.sessionId].lastTs) sessions[d.sessionId].lastTs = d.ts;
    });

    sessionsEl.innerHTML = '';
    const sorted = Object.entries(sessions).sort((a, b) => b[1].lastTs - a[1].lastTs);
    
    if (sorted.length === 0) {
      sessionsEl.innerHTML = '<div style="color:#888">No sessions found. Use the app to generate logs.</div>';
      statusEl.textContent = 'No data yet.';
      return;
    }

    sorted.forEach(([sid, info]) => {
      const div = document.createElement('div');
      div.className = 'session-item' + (sid === selectedSession ? ' active' : '');
      const time = new Date(info.firstTs).toLocaleString();
      div.innerHTML = `<span>${sid}</span><span class="session-info">${time} — ${info.count} entries</span>`;
      div.onclick = () => { selectedSession = sid; renderSession(sessions[sid]); loadSessions(); };
      sessionsEl.appendChild(div);
    });

    if (selectedSession && sessions[selectedSession]) {
      renderSession(sessions[selectedSession]);
    } else if (sorted.length > 0) {
      selectedSession = sorted[0][0];
      renderSession(sorted[0][1]);
    }
    
    statusEl.textContent = `Loaded ${allDocs.length} docs, ${sorted.length} sessions. Last update: ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    statusEl.textContent = 'Error: ' + e.message;
    console.error(e);
  }
}

function renderSession(session) {
  const allEntries = [];
  session.docs.forEach(d => {
    (d.entries || []).forEach(e => allEntries.push(e));
  });
  allEntries.sort((a, b) => a.seq - b.seq);

  const filter = filterEvt.value;
  const noIdle = hideIdle.checked;

  logBody.innerHTML = '';
  allEntries.forEach(e => {
    if (filter && e.event !== filter) return;
    if (noIdle && e.event === 'idle') return;
    
    const tr = document.createElement('tr');
    tr.className = 'event-' + e.event;
    const ts = new Date(e.t).toISOString().substr(11, 12);
    const extra = [];
    if (e.g !== undefined) extra.push('g=' + e.g);
    if (e.ga !== undefined) extra.push('ga=' + e.ga);
    if (e.note) extra.push(e.note);
    if (e.baseH !== undefined) extra.push('baseH=' + e.baseH);
    if (e.newH !== undefined) extra.push('newH=' + e.newH);
    if (e.finalH !== undefined) extra.push('finalH=' + e.finalH);
    
    tr.innerHTML = `<td>${e.seq}</td><td>${ts}</td><td>${e.event}</td><td>${e.s}</td><td>${e.oX}</td><td>${e.oY}</td><td>${e.sY}</td><td>${e.sR}</td><td>${e.iW}</td><td>${e.iH}</td><td>${e.vvH}</td><td>${e.dSH}</td><td>${e.oH||''}</td><td>${e.sH||''}</td><td>${extra.join(' ')}</td>`;
    logBody.appendChild(tr);
  });
}

filterEvt.onchange = () => loadSessions();
hideIdle.onchange = () => loadSessions();

document.getElementById('refreshBtn').onclick = loadSessions;

document.getElementById('autoBtn').onclick = function() {
  if (autoInterval) {
    clearInterval(autoInterval);
    autoInterval = null;
    this.textContent = '▶ Auto-refresh';
  } else {
    autoInterval = setInterval(loadSessions, 5000);
    this.textContent = '⏸ Stop auto';
    loadSessions();
  }
};

document.getElementById('exportBtn').onclick = function() {
  if (allDocs.length === 0) { alert('No logs to export'); return; }
  
  // Group all docs by session
  const sessions = {};
  allDocs.forEach(d => {
    if (!sessions[d.sessionId]) sessions[d.sessionId] = [];
    sessions[d.sessionId].push(d);
  });

  const sections = [];
  const sorted = Object.entries(sessions).sort((a, b) => {
    const aTs = Math.min(...a[1].map(d => d.ts));
    const bTs = Math.min(...b[1].map(d => d.ts));
    return aTs - bTs;
  });

  sorted.forEach(([sid, docs]) => {
    const allEntries = [];
    docs.forEach(d => (d.entries || []).forEach(e => allEntries.push(e)));
    allEntries.sort((a, b) => a.seq - b.seq);
    
    const lines = allEntries.map(e => {
      const ts = new Date(e.t).toISOString().substr(11, 12);
      let line = e.seq + ' ' + ts + ' ' + e.event + ' s=' + e.s + ' oX=' + e.oX + ' oY=' + e.oY + ' sY=' + e.sY + ' sR=' + e.sR + ' ' + e.iW + 'x' + e.iH + ' vvH=' + e.vvH + ' dSH=' + e.dSH;
      if (e.oH !== undefined) line += ' oH=' + e.oH;
      if (e.sH !== undefined) line += ' sH=' + e.sH;
      if (e.sW !== undefined) line += ' sW=' + e.sW;
      if (e.g !== undefined) line += ' g=' + e.g;
      if (e.ga !== undefined) line += ' ga=' + e.ga;
      if (e.note) line += ' [' + e.note + ']';
      // Include any other extra fields
      const knownKeys = new Set(['seq','t','event','s','oX','oY','sY','sR','iW','iH','vvH','dSH','oH','sH','sW','g','ga','note']);
      Object.keys(e).forEach(k => {
        if (!knownKeys.has(k)) line += ' ' + k + '=' + JSON.stringify(e[k]);
      });
      return line;
    });
    
    sections.push('=== Session: ' + sid + ' ===\nEntries: ' + lines.length + '\n\n' + lines.join('\n'));
  });

  const text = 'Zoom Debug Log - All Sessions\nExported: ' + new Date().toISOString() + '\nTotal sessions: ' + sorted.length + '\n\n' + sections.join('\n\n\n');
  
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'zoom-debug-all-' + Date.now() + '.txt';
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('clearBtn').onclick = async function() {
  if (!confirm('Delete ALL debug logs from Firestore?')) return;
  statusEl.textContent = 'Deleting...';
  try {
    for (const d of allDocs) {
      await deleteDoc(doc(db, 'zoomDebug', d.id));
    }
    selectedSession = null;
    logBody.innerHTML = '';
    await loadSessions();
    statusEl.textContent = 'All logs deleted.';
  } catch (e) {
    statusEl.textContent = 'Delete error: ' + e.message;
  }
};

loadSessions();
</script>
</body>
</html>
