<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All done — Kid Sequencer</title>
<style>
  html,body{ height:100%; margin:0; }
  body{
    display:flex; align-items:center; justify-content:center;
    background:#f4f1fb;
    font-family:"Comic Sans MS","Comic Sans","Trebuchet MS",Arial,sans-serif;
    color:#1d1d1d; text-align:center; padding:24px; box-sizing:border-box;
  }
  .card{
    background:#fff; border:4px solid #1d1d1d; border-radius:22px;
    box-shadow:0 14px 0 rgba(0,0,0,0.12);
    padding:30px 26px; max-width:360px; width:100%;
  }
  .tick{ font-size:48px; line-height:1; margin-bottom:10px; }
  h1{ font-size:22px; margin:0 0 8px; }
  p{ font-size:15px; color:#33323a; line-height:1.4; margin:0 0 18px; }
  button{
    border:4px solid #1d1d1d; border-radius:14px;
    background:linear-gradient(135deg,#a78bfa 0%,#f472b6 100%);
    color:#fff; font-weight:900; font-size:16px; padding:12px 22px;
    cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,0.12);
    -webkit-appearance:none; appearance:none;
    font-family:inherit;
  }
  button:active{ transform:translateY(2px); box-shadow:0 3px 0 rgba(0,0,0,0.12); }
</style>
</head>
<body>
  <div class="card">
    <div class="tick" aria-hidden="true">✅</div>
    <h1>All done!</h1>
    <p>You can close this tab and head back to Kid Sequencer — your account will update automatically.</p>
    <button onclick="window.close()">Close this tab</button>
  </div>
</body>
</html>
