<script>
// --- CORE FIXES FOR INSTANT AUDIO ---

// 1. Updated getAudio to ensure fresh connections
function getAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    window.audioCtx = audioCtx;
    
    masterGain = audioCtx.createGain();
    window.masterGain = masterGain;
    masterGain.gain.setValueAtTime(1, audioCtx.currentTime);

    masterComp = audioCtx.createDynamicsCompressor();
    // ... rest of your existing compressor settings ...
    
    // Ensure instrument buses are built and connected to master
    bus = makeInstrumentBuses(audioCtx, masterComp);
    masterComp.connect(masterGain);
    masterGain.connect(audioCtx.destination);
  }
  return audioCtx;
}

// 2. Modified play function to remove the "half second delay"
function play() {
  if (playing) return;
  playing = true;
  
  // Initialize/Resume Audio Context immediately on user gesture
  const ctx = getAudio();
  if (ctx.state === 'suspended') {
    ctx.resume();
  }

  // REMOVED: The artificial 750ms delay logic from startTimeout
  // CALLED DIRECTLY:
  startSequencer();
  hasEverStartedPlayback = true;
  
  // Visual feedback
  if (playBtnEl) playBtnEl.classList.add("playing");
  if (playheadEl) {
    playheadEl.style.display = "block";
    playheadEl.classList.add("playing");
  }
}

// 3. Updated stop function to clean up and hide the icon
function stop() {
  playing = false;
  if (timer) {
    clearTimeout(timer);
    timer = null;
  }
  
  stopAllAudioNow(); // Kill any ringing notes

  // Suspend the context to make the blue icon disappear
  if (audioCtx && audioCtx.state === 'running') {
    audioCtx.suspend();
  }

  if (playBtnEl) playBtnEl.classList.remove("playing");
  if (playheadEl) {
    playheadEl.classList.remove("playing");
    playheadEl.style.display = "none";
  }
}

</script>
