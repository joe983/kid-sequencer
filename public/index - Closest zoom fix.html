<!-- ADDED: iOS viewport height fix script - run immediately to prevent layout shift -->
<script>
(function() {
  // Track actual viewport height to handle iOS Safari's dynamic toolbar
  function setVH() {
    // Use the smaller of window.innerHeight (excludes toolbar when hidden) 
    // and visualViewport.height (actual visible area)
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--vh', `${vh * 0.01}px`);
  }
  
  // Set immediately
  setVH();
  
  // Update on resize and orientation change
  window.addEventListener('resize', setVH);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setVH);
    window.visualViewport.addEventListener('scroll', setVH);
  }
  
  // Handle orientation changes
  window.addEventListener('orientationchange', () => {
    // Delay to let the browser settle
    setTimeout(setVH, 100);
    setTimeout(setVH, 300);
    setTimeout(setVH, 500);
  });
})();

// ADDED: Save/restore scroll position to prevent jump on refresh
(function() {
  const STORAGE_KEY = 'kidseq_scroll';
  
  // Restore scroll position on load
  window.addEventListener('DOMContentLoaded', () => {
    try {
      const saved = sessionStorage.getItem(STORAGE_KEY);
      if (saved) {
        const { scrollX, scrollY, zoom } = JSON.parse(saved);
        // Apply zoom first if browser remembered it
        if (zoom && window.visualViewport) {
          // The browser will restore zoom automatically, we just need to restore scroll
          setTimeout(() => {
            window.scrollTo(scrollX || 0, scrollY || 0);
          }, 50);
        } else {
          window.scrollTo(scrollX || 0, scrollY || 0);
        }
      }
    } catch (e) {
      console.warn('Could not restore scroll:', e);
    }
  });
  
  // Save scroll position before unload
  let saveTimeout;
  function saveScroll() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      try {
        const data = {
          scrollX: window.scrollX || window.pageXOffset || 0,
          scrollY: window.scrollY || window.pageYOffset || 0,
          zoom: window.visualViewport ? window.visualViewport.scale : 1
        };
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        // Ignore storage errors
      }
    }, 100);
  }
  
  window.addEventListener('scroll', saveScroll, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('scroll', saveScroll, { passive: true });
  }
  window.addEventListener('beforeunload', saveScroll);
})();
</script>

html, body {

  position: relative;
  margin: 0;
  padding: 0;

  overscroll-behavior: none; /* prevent pull-to-refresh and bounce */
}

/* ADDED: Ensure body is tall enough to scroll and hide Safari toolbar */

#viewport{
  position: relative;
  width: 100%;
  min-height: calc(var(--vh, 1vh) * 100);

  -webkit-overflow-scrolling: touch;
  touch-action: pan-x pan-y pinch-zoom; /* FIXED: explicitly enable pan and zoom */
}


/* --- Stage-scale mode (small landscape phones): NO transform scaling, use native zoom --- */

  padding-bottom: env(safe-area-inset-bottom, 0px);

}
html.stageScaled #page{

}

(function() {
  'use strict';

  const TABLET_MIN_W = 768;
  const PHONE_LANDSCAPE_MAX_H = 500;
  
  let currentMode = null;
  let resizeTimer = null;
  
  function detectAndApplyMode() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const isLandscape = w > h;
    const isTablet = w >= TABLET_MIN_W;
    const isPhone = w < TABLET_MIN_W;
    const isShortLandscape = isLandscape && h <= PHONE_LANDSCAPE_MAX_H;
    
    let newMode = 'default';
    
    if (isTablet && isLandscape) {
      newMode = 'tabletScaled';
    } else if (isPhone && isShortLandscape) {
      newMode = 'stageScaled';
    }
    
    if (newMode !== currentMode) {
      document.documentElement.classList.remove('stageScaled', 'tabletScaled');
      
      if (newMode !== 'default') {
        document.documentElement.classList.add(newMode);
      }
      
      currentMode = newMode;
      
      // REMOVED: No more transform scaling for stageScaled mode
      // Let iOS handle zoom natively
    }
  }
  
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(detectAndApplyMode, 100);
  }
  
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => {
    setTimeout(detectAndApplyMode, 100);
    setTimeout(detectAndApplyMode, 300);
  });
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', detectAndApplyMode);
  } else {
    detectAndApplyMode();
  }
  
  document.documentElement.classList.remove('js-loading');
  document.documentElement.classList.add('js-ready');
})();

      const area=sr.getElementById('seqTrackArea');
      const range=sr.getElementById('seqVolRange');
      const knob=sr.getElementById('seqKnob');
      const num=sr.getElementById('seqVolNum');
      if(!area||!range||!knob||!num) return;

      function ensureAudio(){
        try{
          if(typeof window.getAudio==='function'){
            const a=window.getAudio();
            try{if(a&&a.state==='suspended')a.resume();}catch(_){}
          }
        }catch(_){}
      }
      function setMasterGain(v){
        const mg=(typeof window.masterGain!=='undefined'?window.masterGain:
                 (typeof masterGain!=='undefined'?masterGain:null));
        if(mg&&mg.gain&&typeof mg.gain.value==='number'){
          mg.gain.value=v;
        }
      }
      function clamp(n,min,max){return Math.max(min,Math.min(max,n));}

      function getMetrics(){
        // FIXED: No more transform scaling to account for
        const rect=area.getBoundingClientRect();
        const localH=area.clientHeight||area.offsetHeight||rect.height||1;
        
        const knobH=knob.offsetHeight||(parseFloat(getComputedStyle(knob).height)||16);
        const half=knobH/2;
        
        const minC=half;
        const maxC=localH-half;
        return{rect,localH,minC,maxC};
      }

        const m=getMetrics();
        const t=clamp((parseFloat(range.value)||0)/10,0,1);
        const y=m.maxC-(m.maxC-m.minC)*t;
        knob.style.top=y+'px';
        num.textContent=String(Math.round(t*10));
      }

      const setFromClientY=(clientY)=>{
        const m=getMetrics();
        // FIXED: No transform scaling, direct pixel mapping
        const localY=clientY-m.rect.top;
        
        const yRaw=localY-(clickOnKnob?pointerOffset:0);
        const yy=clamp(yRaw,m.minC,m.maxC);
        
        const t=(m.maxC-yy)/(m.maxC-m.minC);
        range.value=String(t*10);
        
        setMasterGain(t);
        layoutFromRange();

      range.addEventListener('input',()=>{
        const v=parseFloat(range.value)/10;
        setMasterGain(v);
        layoutFromRange();
      });

      let dragging=false;
      let moved=false;
      let startX=0,startY=0;
      let pointerOffset=0;
      let clickOnKnob=false;

      const onPointerDown=(e)=>{
        dragging=true;
        moved=false;
        startX=e.clientX;startY=e.clientY;
        clickOnKnob=!!(e.target&&e.target.closest&&e.target.closest('.seqKnob'));
        const m=getMetrics();
        const t0=clamp((parseFloat(range.value)||10)/10,0,1);
        const knobY=m.maxC-(m.maxC-m.minC)*t0;
        const localY=e.clientY-m.rect.top;
        pointerOffset=localY-knobY;
        
        area.setPointerCapture(e.pointerId);
        ensureAudio();
        
        if(!clickOnKnob){
          setFromClientY(e.clientY);
        }
      };

      const onPointerMove=(e)=>{
        if(!dragging)return;
        
        if(!moved){
          const dx=Math.abs(e.clientX-startX);
          const dy=Math.abs(e.clientY-startY);
          if(dx<3&&dy<3)return;
          moved=true;
        }
        setFromClientY(e.clientY);
      };

      const onPointerUp=()=>{
        dragging=false;
        moved=false;
      };

      area.addEventListener('pointerdown',onPointerDown);
      area.addEventListener('pointermove',onPointerMove);
      area.addEventListener('pointerup',onPointerUp);
      area.addEventListener('pointercancel',onPointerUp);

      requestAnimationFrame(layoutFromRange);
      setTimeout(layoutFromRange,50);
    }
  }
  customElements.define('seq-volume-fader',SeqVolumeFader);
})();

// Tap feedback
(function(){
  function isDisabled(btn){
    if(!btn)return true;
    if(btn.disabled)return true;
    const ad=(btn.getAttribute('aria-disabled')||'').toLowerCase();
    if(ad==='true')return true;
    if(btn.classList.contains('disabled'))return true;
    return false;
  }

  function flash(btn){
    if(isDisabled(btn))return;
    const now=performance.now();
    if(btn.__tapFlashAt&&(now-btn.__tapFlashAt)<220)return;
    btn.__tapFlashAt=now;
    btn.classList.remove('tapFlash');
    void btn.offsetWidth;
    btn.classList.add('tapFlash');
    clearTimeout(btn.__tapFlashT);
    btn.__tapFlashT=setTimeout(()=>btn.classList.remove('tapFlash'),220);
  }

  function wire(){
    const selectors=[
      'button[aria-label="Play"]',
      'button[aria-label="Stop"]',
      'button[aria-label="Clear"]',
      'button[aria-label="Undo"]',
      '#cameraBtn',
      'button[aria-label="Scan"]'
    ];
    const btns=selectors.flatMap(sel=>Array.from(document.querySelectorAll(sel)));
    const uniq=Array.from(new Set(btns)).filter(Boolean);

    uniq.forEach(btn=>{
      btn.addEventListener('pointerdown',(e)=>{
        if(e.pointerType==='mouse'&&e.button!==0)return;
        flash(btn);
      },{passive:true});

      btn.addEventListener('keydown',(e)=>{
        if(e.key==='Enter'||e.key===' ')flash(btn);
      });
    });
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wire);
  else wire();
})();
</script>
