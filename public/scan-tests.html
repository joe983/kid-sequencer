<h1>Worksheet scanner — fixtures</h1>
<p class="sub">Synthetic sheets plus real camera frames, run against the live pipeline in index.html.
Open this page and read the table; every case states what it expects and why it exists.</p>
<div id="summary">running…</div>
<table id="out"><thead><tr><th>case</th><th>verdict</th><th>notes read</th><th>expected</th><th>why this case exists</th></tr></thead><tbody></tbody></table>
<iframe id="app" src="index.html?scandebug=0"></iframe>

<script>
/* ============================================================================
   Fixtures for the worksheet scanner.

   Every case here is a bug that actually happened, or a property that broke
   while fixing one. They are kept because tuning this pipeline by eye is how
   the shadow bug, the tool-icon false lock and the grid-bleed sensitivity all
   got through in the first place — each was found by a fixture, not by looking.

   The scanner lives inside index.html's IIFE and is reachable only through
   window.KidSequencer.Scan, so this page drives it through an iframe rather
   than duplicating any of it. Duplicated CV code would drift and then lie.

   Run: open /scan-tests.html on the local server (node serve.js). Machine
   readable results land in window.__scanTests for headless checking.
============================================================================ */

const FRAME_W = 420, FRAME_H = 315;   // the scanner's working resolution

/* A synthetic photo of the printed sheet.
   `quad` is the four mark CENTRES, so passing a trapezoid simulates
   photographing the sheet at an angle: marks AND cells go through the same
   homography, exactly as a real camera would see them. */
function makeSheet(S, G, o){
  o = Object.assign({
    quad: [{x:30,y:30},{x:390,y:30},{x:390,y:285},{x:30,y:285}],
    markPx: 10,      // printed mark size in working pixels
    drop: -1,        // index of a mark to omit (simulates smudged/cut off)
    cells: [],       // [row,col] solidly coloured
    gaps: [],        // [row,col] colour the gap AFTER that cell, so a run merges
    runs: [],        // [row,startCol,len] one continuous bar, gaps included
    shadow: 0,       // strength of a hard-edged diagonal shadow
    dim: 1,          // overall exposure (1 = normal)
    furniture: true, // print the grid outlines, title block, tool icons
    bg: null,        // background beyond the paper (for sheet-overflows-frame)
    speck: 0,        // a stray pen dot OUTSIDE the mark quad
    scribble: 0,     // >0 draws sparse strokes instead of solid fill
    ring: 0          // >0 draws marks as RINGS with this wall fraction (0.3 = 30%)
  }, o);

  const cv = document.createElement("canvas");
  cv.width = FRAME_W; cv.height = FRAME_H;
  const g = cv.getContext("2d", {willReadFrequently:true});
  g.fillStyle = o.bg || "#ffffff"; g.fillRect(0,0,FRAME_W,FRAME_H);

  const H  = S.homographyUnitToQuad(o.quad);
  const q  = (u,v) => H(u,v);                       // sheet coords
  const gq = (u,v) => H(G.grid.u0 + u*(G.grid.u1-G.grid.u0),
                        G.grid.v0 + v*(G.grid.v1-G.grid.v0));   // note-grid coords
  const R = G.rows, C = G.cols, cf = G.cellFrac;
  const poly = (p, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(p[0].x,p[0].y);
    for(let i=1;i<p.length;i++) g.lineTo(p[i].x,p[i].y); g.closePath(); g.fill(); };

  // the paper, so a quad reaching past the canvas leaves real background showing
  poly([q(-0.06,-0.10),q(1.06,-0.10),q(1.06,1.10),q(-0.06,1.10)], "#ffffff");

  if(o.furniture){
    /* A real worksheet is FULL of ink: 128 cell outlines, a title block, the
       tool icons down the side. Bare fixtures reported dark 0.3% where real
       frames report 11-22%, so they were passing a test the real input never
       takes — that is how the tool-icon false lock survived. */
    g.strokeStyle = "#3a3a3a"; g.lineWidth = 1;
    for(let r=0;r<R;r++) for(let c=0;c<C;c++){
      const p = [gq(c/C,(r+0.06)/R), gq((c+cf)/C,(r+0.06)/R),
                 gq((c+cf)/C,(r+0.94)/R), gq(c/C,(r+0.94)/R)];
      g.beginPath(); g.moveTo(p[0].x,p[0].y);
      for(let i=1;i<4;i++) g.lineTo(p[i].x,p[i].y); g.closePath(); g.stroke();
    }
    poly([q(0.06,0.05),q(0.40,0.05),q(0.40,0.13),q(0.06,0.13)], "#2b2b2b");   // title
    for(let i=0;i<5;i++)                                                       // tool icons
      poly([q(0.02,0.24+i*0.13),q(0.055,0.24+i*0.13),
            q(0.055,0.31+i*0.13),q(0.02,0.31+i*0.13)], "#333333");
    poly([q(0.86,0.05),q(0.99,0.05),q(0.99,0.12),q(0.86,0.12)], "#2f2f2f");   // tempo box
  }

  const fill = (u0,u1,r) => {
    if(!o.scribble){
      poly([gq(u0,(r+0.06)/R),gq(u1,(r+0.06)/R),gq(u1,(r+0.94)/R),gq(u0,(r+0.94)/R)], "#2244cc");
    }else{
      /* Faintness on paper is SPARSE full-strength ink, not uniformly pale ink.
         An alpha-blended cell has no pixel dark enough to register at all, so
         alpha is the wrong model for a lightly-coloured square. */
      g.strokeStyle = "#2a44c8"; g.lineWidth = 1;
      for(let i=0;i<=o.scribble;i++){
        const t = i/o.scribble;
        const a = gq(u0+(u1-u0)*t, (r+0.08)/R);
        const b = gq(u0+(u1-u0)*Math.max(0,t-0.55), (r+0.92)/R);
        g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke();
      }
    }
  };
  for(const [r,c] of o.cells) fill(c/C, (c+cf)/C, r);
  for(const [r,c] of o.gaps)  fill((c+cf)/C, (c+1)/C, r);
  // a continuous bar: cells AND the gaps between them, so it reads as ONE note
  for(const [r,c0,n] of o.runs) fill(c0/C, (c0+n-1+cf)/C, r);

  g.fillStyle = "#000000";
  o.quad.forEach((p,i) => { if(i === o.drop) return;
    const x = Math.round(p.x-o.markPx/2), y = Math.round(p.y-o.markPx/2);
    g.fillRect(x, y, o.markPx, o.markPx);
    if(o.ring){
      // punch the hole back out — a ring is the printed mark that no solid tool
      // icon on the sheet can imitate
      const t = Math.max(1, Math.round(o.markPx * o.ring));
      g.clearRect(x+t, y+t, o.markPx-2*t, o.markPx-2*t);
      g.fillStyle = "#ffffff"; g.fillRect(x+t, y+t, o.markPx-2*t, o.markPx-2*t);
      g.fillStyle = "#000000";
    }
  });

  if(o.speck){ const p = q(-0.03,0.5); g.fillStyle="#111111"; g.fillRect(p.x-2,p.y-2,4,4); }

  if(o.shadow){
    const grd = g.createLinearGradient(0,0,FRAME_W*0.9,FRAME_H*0.9);
    grd.addColorStop(0,   "rgba(0,0,0,"+o.shadow+")");
    grd.addColorStop(0.55,"rgba(0,0,0,"+(o.shadow*0.75)+")");
    grd.addColorStop(0.75,"rgba(0,0,0,0)");
    g.fillStyle = grd; g.fillRect(0,0,FRAME_W,FRAME_H);
  }
  if(o.dim < 1){ g.fillStyle = "rgba(0,0,0,"+(1-o.dim)+")"; g.fillRect(0,0,FRAME_W,FRAME_H); }
  return g.getImageData(0,0,FRAME_W,FRAME_H);
}

async function imageDataFromUrl(url){
  const res = await fetch(url, {cache:"no-store"});
  if(!res.ok) throw new Error(url + " -> " + res.status);
  const bmp = await createImageBitmap(await res.blob());
  const c = document.createElement("canvas");
  c.width = bmp.width; c.height = bmp.height;
  const g = c.getContext("2d", {willReadFrequently:true});
  g.drawImage(bmp,0,0);
  return g.getImageData(0,0,c.width,c.height);
}

const CELLS = [[0,0],[3,5],[7,12]];
const WANT  = "0:0+1 3:5+1 7:12+1";
const ASKEW  = [{x:52,y:44},{x:388,y:26},{x:396,y:272},{x:36,y:288}];
const ASKEW2 = [{x:44,y:36},{x:396,y:52},{x:380,y:290},{x:28,y:268}];
const OVER   = [{x:-38,y:-30},{x:452,y:-24},{x:462,y:342},{x:-30,y:352}];
const LEGAL_LENGTHS = [1,2,4,8,16];

/* want: exact note list · expect: exact verdict · refuse: anything but "ok" */
const CASES = [
  { name:"plain",          opt:{cells:CELLS}, want:WANT,
    why:"baseline: a normal sheet, square on, evenly lit" },
  { name:"shadow",         opt:{cells:CELLS, shadow:0.72, dim:0.85}, want:WANT,
    why:"a shadow across one corner used to blow the ink mask from 1% to 25% and lock onto shadow edges" },
  { name:"shadowSoft",     opt:{cells:CELLS, shadow:0.45}, want:WANT,
    why:"partial shade, the common kitchen-table case" },
  { name:"dim",            opt:{cells:CELLS, dim:0.35}, want:WANT,
    why:"whole frame underexposed; a global threshold cannot survive this" },
  { name:"askew",          opt:{cells:CELLS, quad:ASKEW}, want:WANT,
    why:"photographed at an angle: the homography has to actually work" },
  { name:"askew2",         opt:{cells:CELLS, quad:ASKEW2}, want:WANT,
    why:"tilted the other way; measures aspect 1.497, the widest genuine reading seen" },
  { name:"askewShadow",    opt:{cells:CELLS, quad:ASKEW, shadow:0.6, dim:0.8}, want:WANT,
    why:"angle and shadow together, which is what a real hand-held scan looks like" },
  { name:"marks6",         opt:{cells:CELLS, markPx:6}, want:WANT,
    why:"marks near the size floor" },
  { name:"marks5",         opt:{cells:CELLS, markPx:5}, want:WANT,
    why:"real marks measured fa 0.00020-0.00042 against an old 0.0004 floor: the detector was discarding what it hunted for, 103 frames running" },
  { name:"marks4",         opt:{cells:CELLS, markPx:4}, want:WANT,
    why:"camera further back; smallest mark that must still work" },
  { name:"joined",         opt:{cells:[[2,4],[2,5]], gaps:[[2,4]]}, want:"2:4+2",
    why:"colouring across the inter-cell gap must merge into ONE longer note" },
  { name:"speck",          opt:{cells:CELLS, speck:1}, want:WANT,
    why:"a pen dot outside the marks must not veto the scan; one stray blob used to refuse everything" },
  { name:"scribbleDense",  opt:{cells:CELLS, scribble:9}, want:WANT,
    why:"cells scribbled rather than filled, which is how a child actually colours" },
  { name:"scribbleMid",    opt:{cells:CELLS, scribble:7}, want:WANT,
    why:"looser scribble; sparse ink is what faint colouring really looks like" },
  { name:"scribbleShadow", opt:{cells:CELLS, scribble:7, shadow:0.6, dim:0.85}, want:WANT,
    why:"the realistic worst case: sparse ink under uneven light" },
  { name:"blank",          opt:{cells:[]}, expect:"read-empty",
    why:"an uncoloured sheet must say so, not silently clear the grid" },
  { name:"overflow",       opt:{cells:CELLS, quad:OVER, bg:"#2a2a2a"}, refuse:true,
    why:"sheet larger than the frame: marks cut off. Used to pick frame-edge blobs and import noise" },
  { name:"overflowShadow", opt:{cells:CELLS, quad:OVER, bg:"#2a2a2a", shadow:0.6, dim:0.8}, refuse:true,
    why:"same, badly lit" },
  { name:"missingTL",      opt:{cells:CELLS, drop:0}, refuse:true,
    why:"a smudged mark must refuse, never guess a fourth corner" },
  { name:"missingTR",      opt:{cells:CELLS, drop:1}, refuse:true, why:"as above" },
  { name:"missingBR",      opt:{cells:CELLS, drop:2}, refuse:true, why:"as above" },
  { name:"missingBL",      opt:{cells:CELLS, drop:3}, refuse:true,
    why:"THE hard one: a tool icon stands in and the quad stays geometrically plausible (aspect 1.55 vs a genuine 1.497). Only the grid-registration check catches it. See NEXT-SCAN.md" },

  /* RING marks — the planned printed shape (PRINT_MARK_SHAPE). The scanner must
     accept them TODAY, because the print flip and the reprint happen later and
     sheets already in the world carry solid marks. Marks are drawn larger here
     than PRINT_MARK_K currently yields, which is the point: flipping the shape
     needs a size bump too, or the hole is too small to survive a camera. */
  { name:"ring",           opt:{cells:CELLS, markPx:14, ring:0.3}, want:WANT,
    why:"ring marks must read exactly like solid ones" },
  { name:"ringShadow",     opt:{cells:CELLS, markPx:14, ring:0.3, shadow:0.72, dim:0.85}, want:WANT,
    why:"a hole is thinner than a solid mark, so it has to survive uneven light too" },
  { name:"ringAskew",      opt:{cells:CELLS, markPx:14, ring:0.3, quad:ASKEW}, want:WANT,
    why:"perspective squashes the hole; it must still be found" },
  { name:"ringThinWall",   opt:{cells:CELLS, markPx:14, ring:0.22}, want:WANT,
    why:"thinner wall, bigger hole — the easy end for detection, the fragile end for printing" },
  { name:"ringMissingBL",  opt:{cells:CELLS, markPx:14, ring:0.3, drop:3}, refuse:true,
    why:"THE POINT OF RINGS: with only three ringed marks, a solid tool icon can no longer stand in — this is the gap that rings close" },
  { name:"ringSmall",      opt:{cells:CELLS, markPx:7, ring:0.3}, want:WANT,
    why:"a mark near today's printed size: the hole is ~2px and may vanish, so this must fall back to the solid path rather than fail" }
];

/* Note-length snapping: the app has 16th/8th/quarter/half/whole only, so every
   drawn run must land on 1/2/4/8/16 columns. Boundaries are geometric — the
   quarter/half split sits at 5.66 columns, not 6. */
const LENGTH_TABLE = [1,2,4,4,4,8,8,8,8,8,8,16,16,16,16,16];

function fmtNotes(notes){
  return (notes||[]).map(n => n.row+":"+n.start+"+"+n.len).join(" ");
}

function addRow(name, verdict, got, want, why, pass){
  const tr = document.createElement("tr");
  tr.innerHTML = "<td>"+name+"</td><td>"+verdict+"</td><td>"+(got||"")+
    "</td><td class='want'>"+want+"</td><td class='want'>"+why+"</td>";
  tr.firstChild.className = pass ? "p" : "f";
  document.querySelector("#out tbody").appendChild(tr);
}

async function run(){
  const app = document.getElementById("app");
  const S = app.contentWindow.KidSequencer && app.contentWindow.KidSequencer.Scan;
  if(!S){ document.getElementById("summary").textContent = "index.html did not expose KidSequencer.Scan";
          document.getElementById("summary").className = "bad"; return; }
  const G = S.SHEET_GEOMETRY["kidseq:main"];
  const results = [], fails = [];

  for(const t of CASES){
    const d = S.diagnose(makeSheet(S, G, t.opt), "kidseq:main");
    const got = fmtNotes(d.notes);
    const pass = t.refuse ? d.verdict !== "ok"
               : t.expect ? d.verdict === t.expect
               : (d.verdict === "ok" && got === t.want);
    const want = t.refuse ? "(refuse)" : t.expect ? t.expect : t.want;
    addRow(t.name, d.verdict, got, want, t.why, pass);
    results.push({name:t.name, pass, verdict:d.verdict, got});
    if(!pass) fails.push(t.name);
    // nothing in the suite may ever emit a length the app cannot place
    for(const n of (d.notes||[])) if(!LEGAL_LENGTHS.includes(n.len)){
      fails.push(t.name+" illegal length "+n.len);
      addRow(t.name+" · legal lengths", "-", "len "+n.len, "1/2/4/8/16",
             "the app has five note lengths; anything else is unplaceable", false);
    }
  }

  // every drawn run length must collapse to exactly one legal note
  for(let n=1; n<=16; n++){
    const d = S.diagnose(makeSheet(S, G, {cells:[], runs:[[3,0,n]]}), "kidseq:main");
    const want = LENGTH_TABLE[n-1];
    const ok = d.verdict === "ok" && (d.notes||[]).length === 1 && d.notes[0].len === want;
    addRow("length "+n, d.verdict, fmtNotes(d.notes), "one note, len "+want,
           "a coloured block becomes the nearest real note length, never an invented one", ok);
    results.push({name:"length"+n, pass:ok});
    if(!ok) fails.push("length "+n);
  }

  /* The two simpler faces print their own sheets, and the thing that matters
     about them is that a scan gives back what the child COLOURED — not what
     that view's buttons happen to place. /03's two buttons are both one beat
     (2 columns) wide, so reading the legal lengths off the buttons would round
     a single coloured square up to a whole beat and shift it onto the beat;
     /02's buttons place beamed groups, but one shaded square is a single 8th.
     Off-beat starts survive for the same reason: the beat lock is a property of
     tapping, not of reading a pencil mark. */
  /* Each template prints a differently-shaped sheet, so each fixture needs a
     quad of ITS aspect — the default one here is the 8-row sheet's 1.41, and
     feeding that to a 1.86 template is correctly refused as quad-implausible.
     Built from the geometry's own quadAspect so these can't drift apart. */
  const quadFor = (aspect, skew) => {
    const w = 340, h = Math.round(w / aspect);
    const x0 = Math.round((FRAME_W - w) / 2), y0 = Math.round((FRAME_H - h) / 2);
    const s = skew || 0;
    return [{x:x0+s*0.5, y:y0}, {x:x0+w, y:y0+s*0.6},
            {x:x0+w-s*0.5, y:y0+h}, {x:x0, y:y0+h-s*0.6}];
  };
  const VIEW_SHEETS = [
    { id:"kidseq:main5", legal:[1,2,4,8,16],
      cases:[
        { name:"5-note · plain",        opt:{cells:[[0,0],[2,5],[4,12]]}, want:"0:0+1 2:5+1 4:12+1",
          why:"three coloured squares on the five-row sheet come back as three notes" },
        { name:"5-note · single 16th",  opt:{cells:[[1,3]]},              want:"1:3+1",
          why:"one square is one 16th, even though this view's button places a beamed pair" },
        { name:"5-note · off-beat",     opt:{cells:[[3,1]]},              want:"3:1+1",
          why:"a square that is not on a beat stays where it was coloured" },
        { name:"5-note · bottom row",   opt:{cells:[[4,15]]},             want:"4:15+1",
          why:"the last row and last column are both reachable — geometry is not clipped" },
        { name:"5-note · askew",        opt:{cells:[[0,0],[4,15]], askew:true},  want:"0:0+1 4:15+1",
          why:"photographed at an angle, the homography still lands on the right cells" },
        { name:"5-note · run of 4",     opt:{runs:[[2,4,4]]},             want:"2:4+4",
          why:"a continuous block is one held note, not four" }
      ] },
    { id:"kidseq:main3", legal:[1,2,4,8],
      cases:[
        { name:"3-note · plain",        opt:{cells:[[0,0],[1,2],[2,4]]},  want:"0:0+1 1:2+1 2:4+1",
          why:"three coloured squares on the three-row sheet come back as three notes" },
        { name:"3-note · single 8th",   opt:{cells:[[1,2]]},              want:"1:2+1",
          why:"THE case: one square must stay one 8th, not round up to the 2-column beat" },
        { name:"3-note · off-beat",     opt:{cells:[[0,1]]},              want:"0:1+1",
          why:"column 1 is the second half of beat 1 — colouring it there keeps it there" },
        { name:"3-note · beat pair",    opt:{cells:[[2,0],[2,1]]},        want:"2:0+1 2:1+1",
          why:"two squares coloured separately are two 8ths, because the gap between them is white" },
        { name:"3-note · held beat",    opt:{runs:[[2,0,2]]},             want:"2:0+2",
          why:"colouring straight through the gap makes ONE quarter — that is the difference" },
        { name:"3-note · last cell",    opt:{cells:[[2,7]]},              want:"2:7+1",
          why:"the far corner of the smallest grid still maps inside the sheet" },
        { name:"3-note · askew",        opt:{cells:[[0,0],[2,7]], askew:true},  want:"0:0+1 2:7+1",
          why:"photographed at an angle, the smallest grid still registers" }
      ] }
  ];
  for(const sheet of VIEW_SHEETS){
    const VG = S.SHEET_GEOMETRY[sheet.id];
    if(!VG || !VG.grid){
      addRow(sheet.id, "-", "no grid insets", "measured insets",
             "template is unscannable until printMarkInsets() values are pasted in", false);
      fails.push(sheet.id + " has no grid insets");
      continue;
    }
    for(const t of sheet.cases){
      const opt = Object.assign({}, t.opt,
        { quad: quadFor(VG.quadAspect, t.opt.askew ? 16 : 0) });
      delete opt.askew;
      const d = S.diagnose(makeSheet(S, VG, opt), sheet.id);
      const got = fmtNotes(d.notes);
      const pass = d.verdict === "ok" && got === t.want;
      addRow(t.name, d.verdict, got, t.want, t.why, pass);
      results.push({name:t.name, pass, verdict:d.verdict, got});
      if(!pass) fails.push(t.name);
      for(const n of (d.notes||[])) if(!sheet.legal.includes(n.len)){
        fails.push(t.name+" illegal length "+n.len);
        addRow(t.name+" · legal lengths", "-", "len "+n.len, sheet.legal.join("/"),
               "this grid cannot hold that length", false);
      }
    }
  }

  /* Real camera frames — the authority. Synthetic sheets misled us twice, so
     every frame the owner ever sent is kept here with what the CURRENT pipeline
     should make of it. The verdicts recorded in the original logs are NOT used:
     those came from older builds, and several of them were wrong. Each case was
     re-judged against ground truth (what is actually on the paper).

     `want`   exact note list · `refuse` must not return "ok"
     `subset` may find fewer notes than ground truth but must invent none */
  const REAL = [
    { file:"real-01-six-notes.jpg", want:"0:14+2 1:2+1 2:5+1 5:5+1 6:6+1 7:8+4",
      why:"the full sheet: six coloured marks, hand-held on a table. The reference case" },
    { file:"real-02-tapered-run.jpg", want:"0:14+2 1:2+1 6:6+1 7:8+4",
      why:"the bottom run whose LEADING cell measured 0.14 against a 0.20 bar; must read len 4, not 3" },
    { file:"real-03-four-notes.jpg", want:"0:14+2 1:2+1 6:6+1 7:8+4",
      why:"same sheet, different frame. Logged as marks-not-outermost at the time — a single speck outside the quad used to veto a good lock" },
    { file:"real-04-three-notes.jpg", want:"0:14+2 1:2+1 6:6+1",
      why:"earlier state of the sheet, before the bottom run was drawn" },
    { file:"real-05-faint-capture.jpg", subset:"0:14+2 1:2+1 6:6+1 7:8+4", want:"0:14+2 1:2+1 7:8+4",
      why:"KNOWN LIMIT: r6c6 registers 0.08 ink in this frame but 0.25 and 0.50 in others of the same sheet — a blurred capture, not a threshold bug. Asserted as 'invents nothing'; tighten if a future change recovers it" },
    { file:"real-06-refuse-shadow.jpg", refuse:true,
      why:"heavy shadow, 13.9% of the frame reading as ink. Old build locked onto shadow edges" },
    { file:"real-07-refuse-edge.jpg", refuse:true,
      why:"sheet overflowing the frame, 22.3% ink, marks cut off. Old build imported garbage from this" },
    { file:"real-08-refuse-edge.jpg", refuse:true, why:"same session, second frame" },
    { file:"real-09-refuse-wrong-tl.jpg", refuse:true,
      why:"THE dangerous one: a clean frame (4.5% ink) where the detector took a 12px blob at 13,12 as the top-left mark instead of the real one at ~85,54. The old build returned ok and would have imported a misregistered tune" },
    { file:"real-10-refuse-uneven.jpg", refuse:true,
      why:"a 13px blob picked among 35/28/54px marks; size spread refuses it" }
  ];
  for(const t of REAL){
    let d = null, err = null;
    try { d = S.diagnose(await imageDataFromUrl("scan-fixtures/" + t.file), "kidseq:main"); }
    catch(e){ err = e.message; }
    const got = d ? fmtNotes(d.notes) : ("LOAD FAILED: " + err);
    let pass, want;
    if(t.refuse){ want = "(refuse)"; pass = !!d && d.verdict !== "ok"; }
    else if(t.subset){
      // must be a subset of ground truth: missing a note is a capture limit,
      // inventing one is a bug.
      want = "subset of " + t.subset;
      const truth = t.subset.split(" ");
      const found = got ? got.split(" ") : [];
      pass = !!d && d.verdict === "ok" && found.every(n => truth.includes(n)) && got === t.want;
    }
    else { want = t.want; pass = !!d && d.verdict === "ok" && got === t.want; }
    addRow(t.file, d ? d.verdict : "-", got, want, t.why, pass);
    results.push({name:t.file, pass});
    if(!pass) fails.push(t.file);
  }

  const el = document.getElementById("summary");
  el.textContent = fails.length ? (fails.length + " FAILED: " + fails.join(", "))
                                : ("all " + results.length + " checks pass");
  el.className = fails.length ? "bad" : "good";
  window.__scanTests = { total: results.length, fails, results };
}

document.getElementById("app").addEventListener("load", () => {
  run().catch(e => {
    const el = document.getElementById("summary");
    el.textContent = "harness error: " + e.message; el.className = "bad";
    window.__scanTests = { total:0, fails:["harness error: "+e.message], results:[] };
  });
});
</script>
</body>
